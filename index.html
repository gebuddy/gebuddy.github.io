<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141517">
<title>G.E. Buddy</title>
<style>
/* ============ theme tokens ============ */
:root {
  --bg: #f1f0ec;
  --panel: #fff;
  --line: #d9d6cd;
  --fg: #1d1c19;
  --dim: #7a766b;
  --acc: #9a6b00;
  --accfg: #fff;
  --good: #0a6b2e;
  --bad: #c42b2b;
  --warn: #a85d00;
  --sel: #e9e6dc;
  --c-rune: #007777;
  --c-mithril: #0000cc;
  --c-adamant: #006600;
  --c-gilded: #b8860b;
  --c-ring: #cc6600;
  --c-necklace: #cc6600;
}
:root[data-theme=dark] {
  --bg: #141517;
  --panel: #1d1f23;
  --line: #2f3238;
  --fg: #e8e6df;
  --dim: #8b8e96;
  --acc: #e0b13c;
  --accfg: #1a1400;
  --good: #6fcf8f;
  --bad: #ff6b6b;
  --warn: #e5c07b;
  --sel: #272a30;
  --c-rune: #4ec9b0;
  --c-mithril: #569cd6;
  --c-adamant: #6a9955;
  --c-gilded: #dcdcaa;
  --c-ring: #ce9178;
  --c-necklace: #ce9178;
}

/* ============ base ============ */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 15px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
body {
  padding: env(safe-area-inset-top, 0) env(safe-area-inset-right, 0)
           env(safe-area-inset-bottom, 0) env(safe-area-inset-left, 0);
  max-width: 720px;
  margin: 0 auto;
}

/* ============ header ============ */
/* The header artwork is a data URI injected by JS via --hdrimg (see EMBEDDED ASSETS). */
header {
  flex-wrap: wrap;
  position: sticky;
  top: 0;
  z-index: 5;
  display: flex;
  gap: 6px;
  padding: 8px 10px;
  border-bottom: 2px solid var(--acc);
  align-items: center;
  background-image: linear-gradient(rgba(12,12,14,.50), rgba(12,12,14,.32)), var(--hdrimg);
  background-position: 50% 45%;
  background-size: cover;
  background-color: #1d1f23;
  box-shadow: 0 4px 14px rgba(0,0,0,.35);
}
.brand { order: -1; flex: 0 0 100%; display: flex; justify-content: center; }
.brand img {
  height: 58px;
  width: auto;
  max-width: 100%;
  display: block;
  filter: drop-shadow(0 2px 6px rgba(0,0,0,.55));
}
.tabs {
  display: flex;
  flex: 1;
  background: color-mix(in srgb, var(--panel) 84%, transparent);
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 3px;
  gap: 3px;
}
.tabs button {
  flex: 1;
  border: 0;
  background: none;
  color: var(--dim);
  font: inherit;
  font-weight: 600;
  padding: 8px;
  border-radius: 7px;
}
.tabs button.on { background: var(--acc); color: var(--accfg); }
.ib {
  border: 1px solid var(--line);
  background: color-mix(in srgb, var(--panel) 84%, transparent);
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
  color: var(--fg);
  border-radius: 10px;
  width: 42px;
  height: 42px;
  font-size: 16px;
}
header #theme { margin-left: auto; }

/* ============ controls ============ */
#ctl { padding: 10px; display: grid; gap: 8px; }
.row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.in, select, .b {
  font: inherit;
  color: var(--fg);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 9px;
  padding: 9px 11px;
  min-height: 40px;
}
.in { width: 100%; }
.in.sm { width: 64px; padding: 9px 8px; }
.in.bad { border-color: var(--bad); }
select { max-width: 46vw; }
.b { font-weight: 600; }
.b.pri { background: var(--acc); color: var(--accfg); border-color: var(--acc); margin-left: auto; }
.b:disabled { opacity: .5; }
.sw { display: flex; gap: 7px; align-items: center; min-height: 40px; }
.sw input { width: 20px; height: 20px; accent-color: var(--acc); }
.dim { color: var(--dim); }
#adv {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 10px;
}
#adv label { display: grid; gap: 3px; font-size: 13px; color: var(--dim); }
#adv .full { grid-column: 1/-1; }

/* ============ status line ============ */
#st { padding: 2px 12px 6px; font-size: 13px; display: grid; gap: 2px; }
#st .bad { color: var(--bad); }
#st .warn { color: var(--warn); }
#st .info { color: var(--acc); }

/* ============ mobile card list ============ */
#list { list-style: none; margin: 0; padding: 0 10px; display: grid; gap: 7px; transition: opacity .15s; }
#list.dim { opacity: .45; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; cursor: pointer; }
.card:active { background: var(--sel); }
.top { display: flex; gap: 11px; align-items: center; }
.mid { flex: 1; min-width: 0; display: grid; gap: 3px; }
.mid .nm { display: block; }
.meta {
  display: flex;
  flex-wrap: wrap;
  gap: 2px 12px;
  font-size: 13px;
  font-variant-numeric: tabular-nums;
  align-items: center;
}
.meta i, .gr i { font-style: normal; color: var(--dim); font-size: 12px; }
.meta .up { color: var(--good); }
.meta .dn { color: var(--bad); }
.pill { border: 1px solid var(--line); border-radius: 6px; padding: 0 5px; font-size: 11px; color: var(--dim); }
.rt { text-align: right; display: grid; gap: 2px; flex: none; }
.roi { font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
.card.neg .roi { color: var(--bad); }
.nm { font-weight: 650; overflow-wrap: anywhere; display: flex; align-items: center; gap: 9px; min-width: 0; }
.pf { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--good); }
.card.neg .pf, .card.neg .nm { color: var(--bad); }
.card.old .nm { color: var(--dim); }
.n-rune { color: var(--c-rune); }
.n-mithril { color: var(--c-mithril); }
.n-adamant { color: var(--c-adamant); }
.n-gilded { color: var(--c-gilded); }
.n-ring { color: var(--c-ring); }
.n-necklace { color: var(--c-necklace); }
.gr {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(88px, 1fr));
  gap: 6px 10px;
  margin-top: 9px;
  padding-top: 9px;
  border-top: 1px solid var(--line);
}
.gr span { display: grid; font-variant-numeric: tabular-nums; font-size: 14px; }
.sk {
  height: 78px;
  border-radius: 12px;
  background: linear-gradient(90deg, var(--panel), var(--sel), var(--panel));
  background-size: 200% 100%;
  animation: sh 1.2s linear infinite;
}
@keyframes sh { to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) { .sk { animation: none; } }

/* ============ pagination ============ */
#pg { display: flex; gap: 8px; align-items: center; justify-content: space-between; padding: 12px 10px 28px; }
#pg .in { width: 64px; }

/* ============ bottom sheet / dialog ============ */
#ov { position: fixed; inset: 0; background: #0008; z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
#sh {
  background: var(--panel);
  width: 100%;
  max-width: 720px;
  max-height: 82vh;
  overflow: auto;
  border-radius: 16px 16px 0 0;
  padding: 16px 16px calc(18px + env(safe-area-inset-bottom, 0));
  display: grid;
  gap: 8px;
}
#sh h3 { margin: 0 0 4px; font-size: 17px; overflow-wrap: anywhere; }
.kv {
  display: flex;
  justify-content: space-between;
  padding: 6px 0;
  border-bottom: 1px solid var(--line);
  font-variant-numeric: tabular-nums;
}
.kv span:first-child { color: var(--dim); }
.act { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; }
.act .b, .act a { text-align: center; text-decoration: none; color: var(--fg); display: flex; align-items: center; justify-content: center; }
.chk { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.chk input { width: 20px; height: 20px; accent-color: var(--acc); }
#sh .code {
  font: 700 30px/1 ui-monospace, Menlo, Consolas, monospace;
  letter-spacing: .3em;
  text-align: center;
  padding: 16px 0 16px .3em;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 10px;
  color: var(--acc);
  user-select: all;
}
#sh .err { color: var(--bad); font-size: 14px; }
#sh .sec { display: grid; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--line); }
#sh p { margin: 0; font-size: 14px; }

/* ============ desktop table ============ */
#tbl { padding: 0 10px; }
#tbl.dim { opacity: .45; }
table { width: 100%; border-collapse: separate; border-spacing: 0; font-variant-numeric: tabular-nums; font-size: 14px; }
th {
  position: sticky;
  top: 59px;
  z-index: 2;
  background: var(--bg);
  text-align: right;
  font-weight: 600;
  color: var(--dim);
  padding: 9px 10px;
  border-bottom: 1px solid var(--line);
  cursor: pointer;
  white-space: nowrap;
  user-select: none;
}
th:hover { color: var(--fg); }
th.on { color: var(--acc); }
th.l { text-align: left; cursor: default; }
td { padding: 5px 10px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
td.l { text-align: left; white-space: normal; }
tbody tr { cursor: pointer; }
tbody tr:nth-child(odd) { background: var(--panel); }
tbody tr:hover { background: var(--sel); }
tr.neg td { color: var(--bad); }
tr.old .nm { color: var(--dim); }
td.pos { color: var(--good); font-weight: 650; }
td.up { color: var(--good); }
td.dn { color: var(--bad); }
.ic { width: 40px; height: 40px; object-fit: contain; flex: none; image-rendering: pixelated; }
.ic.big { width: 44px; height: 44px; }
.ic.sm { width: 28px; height: 28px; }

/* ============ toast ============ */
#toast {
  position: fixed;
  left: 50%;
  bottom: calc(24px + env(safe-area-inset-bottom, 0));
  transform: translateX(-50%);
  background: var(--fg);
  color: var(--bg);
  padding: 9px 16px;
  border-radius: 20px;
  z-index: 30;
  font-size: 14px;
}

/* ============ wide layout (>=900px) ============ */
@media (min-width: 900px) {
  body { max-width: 1500px; }
  header { padding: 10px 16px; flex-wrap: nowrap; background-position: 50% 14%; }
  .tabs { flex: none; width: 340px; order: 0; }
  .brand { order: 1; flex: 1 1 auto; justify-content: center; padding-left: 12%; }
  .brand img { height: 48px; }
  header .ib { order: 2; }
  header #theme { margin-left: 0; }
  th { top: 70px; }
  #ctl { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 12px 16px; }
  #ctl > .row { display: contents; }
  #ctl > .in { width: 280px; }
  select { max-width: none; }
  #adv { flex-basis: 100%; grid-template-columns: repeat(6, 1fr); }
  #adv .full { grid-column: span 2; }
  #st { padding: 2px 16px 8px; display: flex; flex-wrap: wrap; gap: 2px 22px; }
  #tbl { padding: 0 16px; }
  #pg { padding: 14px 16px 32px; }
  #ov { align-items: center; }
  #sh { border-radius: 16px; max-width: 460px; }
}
</style>
</head>
<body>
<header>
  <div class="brand"><img id="logo" alt="G.E. Buddy"></div>
  <div class="tabs"><button data-t="merch">Merch / Flip</button><button data-t="alch">Alch Items</button></div>
  <button class="ib" id="theme" aria-label="Toggle theme"></button>
  <button class="ib" id="cfgb" aria-label="Save or load settings">⚙</button>
  <button class="ib" id="info" aria-label="Help">?</button>
</header>
<div id="ctl"></div>
<div id="st"></div>
<ul id="list"></ul>
<div id="tbl" hidden></div>
<div id="pg"></div>
<div id="ov" hidden><div id="sh" role="dialog"></div></div>
<div id="toast" hidden></div>

<script>
'use strict';
window.onerror = (m, u, l) => {
  const d = document.createElement('div');
  d.style.cssText = 'padding:10px;color:#f66;font:13px monospace';
  d.textContent = 'Script error: ' + m + ' (line ' + l + ')';
  document.body.prepend(d);
};

/* ---------- tiny helpers ---------- */
const $ = (s, e = document) => e.querySelector(s);
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d } catch { return d } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch {} },
};
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Number(n).toLocaleString('en-US');
const SUF = { k: 1e3, m: 1e6, b: 1e9 };
function parseNum(t, suffix = true, float = false) {
  let s = String(t).trim().toLowerCase().replace(/[,_]/g, '');
  let m = 1;
  if (suffix && SUF[s.slice(-1)]) { m = SUF[s.slice(-1)]; s = s.slice(0, -1); }
  const v = Number(s) * m;
  if (!s || !isFinite(v)) throw 0;
  return float ? v : Math.round(v);
}
function fmtAge(ts, now = Date.now() / 1e3) {
  if (!ts) return 'N/A';
  const s = Math.max(0, Math.floor(now - ts));
  return s < 60 ? s + 's ago' : s < 3600 ? Math.floor(s / 60) + 'm ago'
       : s < 86400 ? Math.floor(s / 3600) + 'h ago' : Math.floor(s / 86400) + 'd ago';
}

/* ---------- data layer ---------- */
const API = 'https://prices.runescape.wiki/api/v1/osrs/';
/* Items exempt from the 2% GE trade tax (non-tradeable-utility list). */
const EX = new Set(['old school bond', 'chisel', 'gardening trowel', 'glassblowing pipe',
  'hammer', 'needle', 'pestle and mortar', 'rake', 'saw', 'secateurs', 'seed dibber',
  'shears', 'spade', 'watering can']);
const tax = (n, p) => EX.has(n.toLowerCase()) ? 0 : Math.min(Math.floor(p * .02), 5e6);
const J = async u => { const r = await fetch(u); if (!r.ok) throw Error('HTTP ' + r.status); return r.json(); };

async function getMapping() {
  const c = LS.get('osrs_map2', null);
  if (c && Date.now() - c.t < 864e5) return c.d;   // cache mapping for 24h
  const d = (await J(API + 'mapping')).map(m => ({
    id: m.id, name: m.name, limit: m.limit, members: m.members,
    highalch: m.highalch, icon: m.icon,
  }));
  LS.set('osrs_map2', { t: Date.now(), d });
  return d;
}

let RAW = null, RAWTS = 0, inflight = null;
function getRaw() {
  if (RAW && Date.now() - RAWTS < 25000) return Promise.resolve({ raw: RAW, info: { ts: RAWTS / 1e3 } });
  if (inflight) return inflight;
  return inflight = (async () => {
    try {
      const mapping = await getMapping();
      const [p, v, d] = await Promise.all([J(API + 'latest'), J(API + 'volumes'), J(API + '24h')]);
      const prices = p.data || {}, old = d.data || {}, trends = {};
      for (const id in prices) {
        const a = old[id] && old[id].low, b = prices[id].low;
        trends[id] = (a != null && b != null) ? (b > a ? 1 : b < a ? -1 : 0) : 0;
      }
      RAW = { mapping, prices, volumes: v.data || {}, trends };
      RAWTS = Date.now();
      return { raw: RAW, info: { ts: RAWTS / 1e3 } };
    } catch (e) {
      if (RAW) return { raw: RAW, info: { stale: true, ts: RAWTS / 1e3, error: e.message } };
      throw e;
    } finally { inflight = null; }
  })();
}

/* ---------- filtering / sorting ---------- */
function common(l, a) {
  if (!a.all) l = l.filter(i => !i.members);
  if (a.search) { const q = a.search.toLowerCase(); l = l.filter(i => i.name.toLowerCase().includes(q)); }
  if (a.hidden.size) l = l.filter(i => !a.hidden.has(i.name));
  if (a.watchOnly) l = l.filter(i => a.watch.has(i.name));
  return l;
}
function fin(l, a) {
  l = common(l, a);
  l.sort((x, y) => (y[a.sort] - x[a.sort]) * (a.desc ? 1 : -1));
  return l;
}

function procMerch(R, a) {
  const now = Date.now() / 1e3, out = [];
  for (const m of R.mapping) {
    const lim = m.limit || 0; if (!lim) continue;
    const id = String(m.id), vol = R.volumes[id] || 0; if (vol < a.min_volume) continue;
    const l = R.prices[id]; if (!l || l.low == null || l.high == null) continue;
    if (a.max_age > 0) {
      if (!l.lowTime || !l.highTime) continue;
      if ((now - Math.min(l.lowTime, l.highTime)) / 60 > a.max_age) continue;
    }
    const buy = l.low, sell = l.high, margin = sell - buy;
    const tx = tax(m.name, sell), profit = margin - tx, roi = buy > 0 ? profit / buy * 100 : 0;
    out.push({
      id, icon: m.icon, name: m.name, buy, sell, margin, tax: tx, profit, roi,
      volume: vol, limit: lim, potential: profit * lim, trend: R.trends[id] || 0,
      last_ts: l.lowTime || 0, members: !!m.members,
    });
  }
  return fin(out.filter(i => i.profit >= a.min_profit && i.roi >= a.min_roi && i.potential >= a.min_potential), a);
}

function procAlch(R, a) {
  const out = [];
  for (const m of R.mapping) {
    const lim = m.limit || 0, ha = m.highalch || 0; if (!lim || !ha) continue;
    const id = String(m.id), l = R.prices[id]; if (!l || l.low == null) continue;
    const vol = R.volumes[id] || 0; if (!vol) continue;
    const ge = l.low, profit = ha - ge;
    out.push({
      id, icon: m.icon, name: m.name, ge_price: ge, high_alch: ha, profit,
      roi: ge > 0 ? profit / ge * 100 : 0, limit: lim, volume: vol,
      max_profit: profit * lim, profit_per_min: Math.trunc(profit * lim / 240),
      members: !!m.members, last_ts: l.lowTime || 0,
    });
  }
  return fin(out.filter(i => i.profit >= a.min_profit && i.roi >= a.min_roi && i.volume >= a.min_volume && i.limit >= a.min_limit), a);
}

/* ---------- tab definitions ---------- */
const trendCh = v => v === 1 ? '▲' : v === -1 ? '▼' : '-';
const ageCell = v => `<span data-ts="${v}">${fmtAge(v)}</span>`;
const TABS = {

    nums: [['min_profit', 'Min profit', 0, 'int'], ['min_roi', 'Min ROI (%)', 0, 'float'],
           ['min_volume', 'Min volume', 0, 'int'], ['min_limit', 'Min limit', 1, 'int']],
    cols: [['ge_price', 'GE price', fmt], ['high_alch', 'High alch', fmt], ['profit', 'Profit', fmt],
           ['roi', 'ROI', v => v.toFixed(2) + '%'], ['limit', 'Limit', fmt], ['volume', 'Volume', fmt],
           ['max_profit', 'Max profit', fmt], ['profit_per_min', 'Profit/min', fmt],
           ['members', 'Members', v => v ? 'Yes' : 'No']],
    defCols: ['limit', 'volume', 'max_profit', 'profit_per_min'], hd: ['ge_price', 'high_alch'],
    watchOv: { min_profit: -1e12, min_roi: -1e9, min_volume: 0, min_limit: 0 },
    presets: {},
  },
};
const fixedCols = t => [...TABS[t].hd, 'profit', 'roi'];
const lbl = (t, k) => (TABS[t].cols.find(c => c[0] === k) || [, k])[1];

/* ---------- state ---------- */
const cfg = LS.get('osrs_cfg', {});
let dark = cfg.dark !== false, cur = cfg.tab === 'alch' ? 'alch' : 'merch';
const defState = t => ({
  search: '', f2p: true, sort: TABS[t].sorts[0], desc: true, watchOnly: false,
  adv: false, auto: false, interval: String(TABS[t].defInt), ps: 25,
  cols: [...TABS[t].defCols], dcols: TABS[t].cols.map(c => c[0]),
  nums: Object.fromEntries(TABS[t].nums.map(n => [n[0], String(n[2])])),
});
const S = {}, L = {}, V = {}, REQ = { merch: 0, alch: 0 }, TM = {};
for (const t in TABS) {
  S[t] = Object.assign(defState(t), (cfg.st || {})[t]);
  S[t].nums = Object.assign(defState(t).nums, S[t].nums);
  const l = (cfg.lists || {})[t] || {};
  L[t] = { hidden: [...(l.hidden || [])], watch: [...(l.watch || [])] };
  V[t] = { items: [], info: null, err: null, busy: false, page: 0, note: '' };
}
const save = () => LS.set('osrs_cfg', { dark, tab: cur, st: S, lists: L });
const presetsOf = t => Object.assign({}, TABS[t].presets, LS.get('osrs_presets_' + t, {}));
const num = (t, k) => {
  const n = TABS[t].nums.find(x => x[0] === k), raw = S[t].nums[k];
  if (!String(raw).trim()) return n[2];
  try { return parseNum(raw, n[3] === 'int', n[3] === 'float'); } catch { return n[2]; }
};
const numOk = (t, k) => {
  const n = TABS[t].nums.find(x => x[0] === k), raw = S[t].nums[k];
  if (!String(raw).trim()) return true;
  try { parseNum(raw, n[3] === 'int', n[3] === 'float'); return true; } catch { return false; }
};
function args(t) {
  const s = S[t], a = {
    search: s.search.trim(), all: !s.f2p, sort: s.sort, desc: s.desc,
    hidden: new Set(L[t].hidden), watch: new Set(L[t].watch), watchOnly: s.watchOnly,
  };
  TABS[t].nums.forEach(n => a[n[0]] = num(t, n[0]));
  if (s.watchOnly) Object.assign(a, TABS[t].watchOv, { all: true });
  return a;
}

/* ---------- refresh ---------- */
async function refresh(t) {
  const id = ++REQ[t], v = V[t];
  v.busy = true; if (t === cur) render();
  try {
    const { raw, info } = await getRaw(), items = TABS[t].proc(raw, args(t));
    if (id !== REQ[t]) return;
    Object.assign(v, { items, info, err: null, page: 0 });
  } catch (e) {
    if (id !== REQ[t]) return;
    v.err = (e.message || 'Request failed') +
      (/^https?:$/.test(location.protocol) ? '' : '. This page was opened as a local file; serve it over http instead (see help)');
  }
  v.busy = false; if (t === cur) render(); save();
}
function interval(t) {
  let n;
  try { n = parseNum(S[t].interval); } catch { n = TABS[t].defInt; }
  if (n < TABS[t].minInt) { n = TABS[t].minInt; V[t].note = `Interval raised to the ${n}s minimum.`; }
  S[t].interval = String(n);
  const el = $('[data-k=interval]'); if (el && t === cur) el.value = n;
  return n;
}
function arm(t) {
  clearTimeout(TM[t]);
  if (S[t].auto) {
    const n = interval(t);
    TM[t] = setTimeout(async () => { await refresh(t); arm(t); }, n * 1000);
  }
}

/* ---------- UI: controls ---------- */

  </div>
  <div class="row">
    <button class="b" data-a="adv" id="advb"></button><button class="b" data-a="cols">Columns</button><button class="b" data-a="hid" id="hidb"></button><button class="b" data-a="reset">Reset</button>
  </div>
  <div id="adv" ${s.adv ? '' : 'hidden'}>
    ${T.nums.map(n => `<label>${n[1]}<input class="in ${numOk(t, n[0]) ? '' : 'bad'}" data-n="${n[0]}" inputmode="decimal" value="${esc(s.nums[n[0]])}"></label>`).join('')}
    <label class="full">Presets<select id="ps"><option value="">Select a preset</option>${Object.keys(ps).map(k => `<option>${esc(k)}</option>`).join('')}</select></label>

  </div>`;
  upd();
}
function upd() {
  const t = cur, s = S[t];
  const n = TABS[t].nums.filter(([k, , d, kind]) => {
    const r = String(s.nums[k]).trim();
    if (!r) return false;
    try { return parseNum(r, kind === 'int', kind === 'float') !== d; } catch { return true; }
  }).length;
  const a = $('#advb'); if (a) a.textContent = `Filters${n && !s.adv ? ` (${n} active)` : ''} ${s.adv ? '▼' : '▶'}`;
  const h = $('#hidb'); if (h) h.textContent = `Hidden (${L[t].hidden.length})`;
}
$('#ctl').addEventListener('input', e => {
  const el = e.target, d = el.dataset, s = S[cur];
  if (d.n) { s.nums[d.n] = el.value; el.classList.toggle('bad', !numOk(cur, d.n)); upd(); }
  else if (d.k === 'search') { s.search = el.value; clearTimeout(window._deb); window._deb = setTimeout(() => refresh(cur), 400); }
  else if (d.k === 'interval') s.interval = el.value;
});
$('#ctl').addEventListener('change', e => {
  const el = e.target, k = el.dataset.k, s = S[cur]; if (!k) return;
  if (k === 'f2p' || k === 'watchOnly') { s[k] = el.checked; refresh(cur); }
  else if (k === 'sort') { s.sort = el.value; s.desc = true; ctl(); refresh(cur); }
  else if (k === 'auto') { s.auto = el.checked; arm(cur); if (s.auto) refresh(cur); }
  else if (k === 'interval') { interval(cur); arm(cur); }
});
$('#ctl').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('input')) { clearTimeout(window._deb); refresh(cur); } });
$('#ctl').addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b) return;
  const a = b.dataset.a, t = cur, s = S[t];
  if (a === 'ref') refresh(t);
  else if (a === 'dir') { s.desc = !s.desc; b.textContent = s.desc ? '▼' : '▲'; refresh(t); }
  else if (a === 'adv') { s.adv = !s.adv; $('#adv').hidden = !s.adv; upd(); save(); }
  else if (a === 'cols') colsSheet();
  else if (a === 'hid') hiddenSheet();
  else if (a === 'reset') {
    const d = defState(t);
    Object.assign(s, { search: '', f2p: true, sort: TABS[t].sorts[0], desc: true, watchOnly: false, adv: false, nums: d.nums });
    V[t].note = 'Reset to defaults.'; ctl(); refresh(t);
  }
  else if (a === 'pload') {
    const n = $('#ps').value, p = presetsOf(t)[n]; if (!p) return toast('Select a valid preset');
    s.search = p.search || ''; s.f2p = !p.all;
    s.sort = TABS[t].sorts.includes(p.sort) ? p.sort : TABS[t].sorts[0]; s.desc = true;
    TABS[t].nums.forEach(n => s.nums[n[0]] = String(p[n[0]] ?? n[2]));
    V[t].note = `Loaded preset: ${n}.`; ctl(); refresh(t);
  }
  else if (a === 'psave') {

    if (TABS[t].presets[n]) return toast(`'${n}' is a built-in preset`);
    const u = LS.get('osrs_presets_' + t, {}), ar = args(t), p = { search: ar.search, all: !s.f2p, sort: s.sort };
    TABS[t].nums.forEach(x => p[x[0]] = num(t, x[0]));

  }

    if (TABS[t].presets[n]) return toast(`'${n}' is a built-in preset`);
    if (confirm(`Delete preset '${n}'?`)) {
      const u = LS.get('osrs_presets_' + t, {}); delete u[n]; LS.set('osrs_presets_' + t, u); ctl(); toast('Deleted preset: ' + n);
    }

});

/* ---------- UI: list & table ---------- */
const imgUrl = i => i.icon ? 'https://oldschool.runescape.wiki/images/' + encodeURIComponent(i.icon.replace(/ /g, '_')) : '';
const imgTag = (i, c) => i.icon
  ? `<img class="${c}" src="${imgUrl(i)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">`
  : `<span class="${c}"></span>`;
function nameKey(n) {
  n = n.toLowerCase();
  if (n.split(' ')[0] === 'rune') return 'rune';
  for (const k of ['mithril', 'adamant', 'gilded', 'ring', 'necklace']) if (n.includes(k)) return k;
  return '';
}
const MQ = matchMedia('(min-width:900px)');

function tableHtml(rows, off) {
  const t = cur, T = TABS[t], s = S[t];
  const cols = T.cols.filter(c => s.dcols.includes(c[0])), now = Date.now() / 1e3;
  return `<table><thead><tr><th class="l">Item</th>${cols.map(c => `<th data-s="${c[0]}" class="${c[0] === s.sort ? 'on' : ''}">${c[1]}${c[0] === s.sort ? (s.desc ? ' ▼' : ' ▲') : ''}</th>`).join('')}</tr></thead><tbody>` +
    rows.map((i, x) => {
      const neg = i.profit < 0, old = !neg && i.last_ts && now - i.last_ts > 3600, nk = !neg && !old ? nameKey(i.name) : '';
      return `<tr class="${neg ? 'neg' : ''} ${old ? 'old' : ''}" data-i="${off + x}"><td class="l"><div class="nm ${nk ? 'n-' + nk : ''}">${imgTag(i, 'ic sm')}<span>${L[t].watch.includes(i.name) ? '⭐ ' : ''}${esc(i.name)}</span>${i.members ? '<span class="pill">P2P</span>' : ''}</div></td>` +
        cols.map(c => {
          const k = c[0], cl = k === 'profit' && i.profit > 0 ? 'pos' : k === 'trend' ? (i.trend > 0 ? 'up' : i.trend < 0 ? 'dn' : '') : '';
          return `<td class="${cl}">${c[2](i[k])}</td>`;
        }).join('') + `</tr>`;
    }).join('') + `</tbody></table>`;
}

function render() {
  const t = cur, T = TABS[t], s = S[t], v = V[t], list = $('#list');
  const refb = $('#ctl').querySelector('#refb'); if (refb) refb.disabled = v.busy;

  /* status */
  const now = Date.now() / 1e3, stale = v.info && v.info.stale;
  let cls = 'info', txt;
  if (v.busy) txt = T.msg;
  else if (v.err) { cls = 'bad'; txt = 'Error: ' + v.err + (v.items.length ? ' (showing previous results)' : ''); }
  else if (!v.items.length) txt = s.watchOnly && !L[t].watch.length
    ? 'Watchlist is empty. Tap an item and choose Add to watchlist.'
    : (s.watchOnly ? 'Watchlist: ' : '') + 'No items matched filters.';
  else txt = `${s.watchOnly ? 'Watchlist: ' : ''}${fmt(v.items.length)} matching items.`;
  if (stale && !v.busy) { cls = 'warn'; txt += ` (live fetch failed${v.info.error ? ': ' + v.info.error.slice(0, 80) : ''})`; }
  const stamp = v.info ? new Date(v.info.ts * 1e3).toLocaleTimeString([], { hour12: false }) : '';
  const it = v.items, avg = a => a.reduce((x, y) => x + y, 0) / a.length;
  $('#st').innerHTML = `<div class="${cls}">${esc((v.note ? v.note + '  ' : '') + txt)}</div>` +
    (v.info ? `<div class="${stale ? 'warn' : 'dim'}">${stale ? 'Offline, cached data from ' : 'Updated '}${stamp}</div>` : '') +
    (it.length ? `<div class="dim">Avg profit ${fmt(Math.round(avg(it.map(i => i.profit))))} gp · Avg ROI ${avg(it.map(i => i.roi)).toFixed(2)}% · Best ROI ${Math.max(...it.map(i => i.roi)).toFixed(2)}%</div>` : '');
  if (!v.busy) v.note = '';

  /* list */
  if (v.busy && !it.length) {
    $('#tbl').hidden = true; list.hidden = false; list.className = '';
    list.innerHTML = '<li class="sk"></li>'.repeat(6); $('#pg').innerHTML = '';
    return;
  }
  const desk = MQ.matches;
  list.hidden = desk; $('#tbl').hidden = !desk;
  list.className = $('#tbl').className = v.busy ? 'dim' : '';
  const ps = Math.max(1, parseInt(s.ps) || 25), pages = Math.max(1, Math.ceil(it.length / ps));
  v.page = Math.min(v.page, pages - 1);
  const rows = it.slice(v.page * ps, v.page * ps + ps);
  const fx = fixedCols(t), cols = T.cols.filter(c => !fx.includes(c[0]) && s.cols.includes(c[0]));
  const roiF = T.cols.find(c => c[0] === 'roi')[2];
  if (desk) { $('#tbl').innerHTML = tableHtml(rows, v.page * ps); }
  else list.innerHTML = rows.map((i, x) => {
    const neg = i.profit < 0, old = !neg && i.last_ts && now - i.last_ts > 3600, nk = !neg && !old ? nameKey(i.name) : '';
    const meta = T.hd.map(k => `<span><i>${lbl(t, k)}</i> ${fmt(i[k])}</span>`).join('') +
      (T.trend && i.trend ? `<span class="${i.trend > 0 ? 'up' : 'dn'}">${trendCh(i.trend)}</span>` : '') +
      (i.members ? '<span class="pill">P2P</span>' : '');
    return `<li class="card${neg ? ' neg' : ''}${old ? ' old' : ''}" data-i="${v.page * ps + x}"><div class="top">${imgTag(i, 'ic')}<div class="mid"><div class="nm ${nk ? 'n-' + nk : ''}">${L[t].watch.includes(i.name) ? '⭐ ' : ''}${esc(i.name)}</div><div class="meta">${meta}</div></div><div class="rt"><div class="pf">${i.profit > 0 ? '+' : ''}${fmt(i.profit)}</div><div class="roi">${roiF(i.roi)} ROI</div></div></div>` +
      (cols.length ? `<div class="gr">${cols.map(c => `<span><i>${c[1]}</i>${c[2](i[c[0]])}</span>`).join('')}</div>` : '') + `</li>`;
  }).join('');
  $('#pg').innerHTML = it.length ? `<button class="b" data-p="-1" ${v.page ? '' : 'disabled'}>‹ Prev</button><span class="dim">Page ${v.page + 1} of ${pages}</span><button class="b" data-p="1" ${v.page < pages - 1 ? '' : 'disabled'}>Next ›</button><input class="in" id="psz" inputmode="numeric" value="${ps}" aria-label="Items per page">` : '';
}
$('#pg').addEventListener('click', e => {

$('#pg').addEventListener('change', e => {
  if (e.target.id === 'psz') { S[cur].ps = Math.max(1, parseInt(e.target.value) || 25); V[cur].page = 0; render(); save(); }

$('#tbl').addEventListener('click', e => {

/* ---------- sheets (bottom-sheet dialogs) ---------- */
function sheet(html) { $('#sh').onclick = $('#sh').onchange = null; $('#sh').innerHTML = html; $('#ov').hidden = false; }
function closeSheet() { $('#ov').hidden = true; }
$('#ov').addEventListener('click', e => { if (e.target.id === 'ov' || e.target.dataset.close !== undefined) closeSheet(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeSheet();
  if (e.key === 'F5') { e.preventDefault(); refresh(cur); }

function itemSheet(i) {
  if (!i) return;
  const t = cur, w = L[t].watch.includes(i.name);
  const wiki = 'https://oldschool.runescape.wiki/w/' + encodeURIComponent(i.name.trim().replace(/ /g, '_'));
  sheet(`<h3 class="nm">${imgTag(i, 'ic big')}<span>${esc(i.name)}</span></h3>` +
    TABS[t].cols.map(c => `<div class="kv"><span>${c[1]}</span><span>${c[2](i[c[0]])}</span></div>`).join('') +
    `<div class="act"><a class="b" href="https://prices.runescape.wiki/osrs/item/${i.id}" target="_blank" rel="noopener">Price history</a><a class="b" href="${wiki}" target="_blank" rel="noopener">Wiki page</a>
    <button class="b" id="a-copy">Copy name</button><button class="b" id="a-watch">${w ? 'Remove from watchlist' : 'Add to watchlist'}</button>
    <button class="b" id="a-hide">Hide item</button><button class="b" data-close>Close</button></div>`);
  $('#a-copy').onclick = () => { copy(i.name); closeSheet(); };
  $('#a-watch').onclick = () => {
    const l = L[t];
    if (w) l.watch = l.watch.filter(n => n !== i.name);
    else { l.watch.push(i.name); l.hidden = l.hidden.filter(n => n !== i.name); }
    save(); upd(); closeSheet();
    S[t].watchOnly ? refresh(t) : render();
  };
  $('#a-hide').onclick = () => {
    const l = L[t];
    if (!l.hidden.includes(i.name)) l.hidden.push(i.name);
    l.watch = l.watch.filter(n => n !== i.name);
    save(); upd(); closeSheet(); refresh(t);
  };
}

function colsSheet() {
  const t = cur, s = S[t], key = MQ.matches ? 'dcols' : 'cols';
  const all = TABS[t].cols.filter(c => MQ.matches || !fixedCols(t).includes(c[0]));
  sheet(`<h3>Columns</h3>` +
    all.map(c => `<label class="chk"><input type="checkbox" value="${c[0]}" ${s[key].includes(c[0]) ? 'checked' : ''}>${c[1]}</label>`).join('') +
    `<div class="act"><button class="b" data-close>Done</button></div>`);
  $('#sh').onchange = e => {
    const k = e.target.value;
    s[key] = TABS[t].cols.map(c => c[0]).filter(c => c === k ? e.target.checked : s[key].includes(c));
    save(); render();
  };
}

function hiddenSheet() {
  const t = cur, h = [...L[t].hidden].sort((a, b) => a.toLowerCase() < b.toLowerCase() ? -1 : 1);
  sheet(`<h3>Hidden from this tab</h3>` +
    (h.length
      ? h.map(n => `<div class="kv"><span>${esc(n)}</span><button class="b" data-u="${esc(n)}">Unhide</button></div>`).join('') +
        `<div class="act"><button class="b" data-ua>Unhide all</button><button class="b" data-close>Close</button></div>`
      : `<p class="dim">No hidden items.</p><div class="act"><button class="b" data-close>Close</button></div>`));
  const done = names => {
    L[t].hidden = L[t].hidden.filter(n => !names.includes(n));
    V[t].note = `Unhid ${names.length} item(s).`;
    save(); upd(); refresh(t); hiddenSheet();
  };
  $('#sh').onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.u !== undefined) done([b.dataset.u]);
    else if (b.dataset.ua !== undefined) done([...L[t].hidden]);
  };
}

/* ---------- settings code: the code itself holds the settings (no server, no database) ---------- */
const b64u = u => {
  let t = '';
  for (let i = 0; i < u.length; i += 0x8000) t += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000));
  return btoa(t).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
};
const unb64u = t => {
  const r = atob(t.replace(/-/g, '+').replace(/_/g, '/')), u = new Uint8Array(r.length);
  for (let i = 0; i < r.length; i++) u[i] = r.charCodeAt(i);
  return u;
};
const pipe = async (bytes, st) => new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(st)).arrayBuffer());
const CODE_PRE = 'GEB-';

function applySettings(d) {
  if (!d || typeof d !== 'object') throw Error('Invalid settings data');
  const obj = x => x && typeof x === 'object' && !Array.isArray(x) ? x : {};
  if (typeof d.dark === 'boolean') dark = d.dark;
  for (const t in TABS) {
    const T = TABS[t], s = Object.assign(defState(t), obj(obj(d.st)[t]));
    s.nums = Object.assign(defState(t).nums, obj(s.nums));
    if (!T.cols.some(c => c[0] === s.sort)) s.sort = T.sorts[0];
    if (!Array.isArray(s.cols)) s.cols = [...T.defCols];
    if (!Array.isArray(s.dcols)) s.dcols = T.cols.map(c => c[0]);
    S[t] = s;
    const l = obj(obj(d.lists)[t]), strs = a => Array.isArray(a) ? a.filter(x => typeof x === 'string') : [];
    L[t] = { hidden: strs(l.hidden), watch: strs(l.watch) };
    const p = obj(d.presets)[t]; if (p && typeof p === 'object') LS.set('osrs_presets_' + t, p);
  }
  cur = d.tab === 'alch' ? 'alch' : 'merch';
  theme(); setTab(cur);
  for (const t in TABS) { refresh(t); arm(t); }
}

/* Compact, compressed serialization of all settings into a short text code. */
async function makeCode() {
  const map = await getMapping().catch(() => []), n2i = new Map();
  for (const m of map) if (!n2i.has(m.name)) n2i.set(m.name, m.id);
  const enc = a => a.map(n => n2i.has(n) ? n2i.get(n) : n);
  const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
  const o = {};
  if (!dark) o.d = 0;
  if (cur === 'alch') o.t = 1;
  for (const t in TABS) {
    const s = S[t], d = defState(t), x = {}, nm = {};
    if (s.search) x.q = s.search;
    if (!s.f2p) x.f = 0;
    if (s.sort !== d.sort) x.o = s.sort;
    if (!s.desc) x.r = 0;
    if (s.watchOnly) x.w = 1;
    if (s.auto) x.u = 1;
    if (s.adv) x.a = 1;
    if (String(s.interval) !== d.interval) x.i = s.interval;
    if (s.ps !== d.ps) x.p = s.ps;
    if (!same(s.cols, d.cols)) x.c = s.cols;
    if (!same(s.dcols, d.dcols)) x.e = s.dcols;
    for (const k in d.nums) if (String(s.nums[k]) !== d.nums[k]) nm[k] = s.nums[k];
    if (Object.keys(nm).length) x.n = nm;
    const h = enc(L[t].hidden), w = enc(L[t].watch);
    if (h.length) x.h = h;
    if (w.length) x.v = w;
    const pr = LS.get('osrs_presets_' + t, {});
    if (Object.keys(pr).length) x.s = pr;
    if (Object.keys(x).length) o[t === 'merch' ? 'm' : 'a'] = x;
  }
  const raw = new TextEncoder().encode(JSON.stringify(o));
  try { return CODE_PRE + 'z' + b64u(await pipe(raw, new CompressionStream('deflate-raw'))); }
  catch { return CODE_PRE + 'j' + b64u(raw); }
}

async function readCode(text) {
  let c = String(text).replace(/\s+/g, '');
  if (c.toUpperCase().startsWith(CODE_PRE)) c = c.slice(CODE_PRE.length);
  if (c.length < 2) throw Error('That code is empty or incomplete.');
  let o;
  try {
    const bytes = unb64u(c.slice(1));
    const raw = c[0] === 'z' ? await pipe(bytes, new DecompressionStream('deflate-raw')) : c[0] === 'j' ? bytes : null;
    if (!raw) throw 0;
    o = JSON.parse(new TextDecoder().decode(raw));
    if (!o || typeof o !== 'object') throw 0;
  } catch { throw Error('That code is not valid. Check that you copied all of it.'); }
  const map = await getMapping().catch(() => []), i2n = new Map();
  for (const m of map) i2n.set(m.id, m.name);
  const names = a => (Array.isArray(a) ? a : []).map(v => typeof v === 'number' ? i2n.get(v) : v).filter(v => typeof v === 'string');
  const d = { dark: o.d !== 0, tab: o.t ? 'alch' : 'merch', st: {}, lists: {}, presets: {} };
  for (const [k, t] of [['m', 'merch'], ['a', 'alch']]) {
    const x = o[k] || {}, s = {};
    if (typeof x.q === 'string') s.search = x.q;
    if (x.f === 0) s.f2p = false;
    if (typeof x.o === 'string') s.sort = x.o;
    if (x.r === 0) s.desc = false;
    if (x.w) s.watchOnly = true;
    if (x.u) s.auto = true;
    if (x.a) s.adv = true;
    if (x.i != null) s.interval = String(x.i);
    if (Number(x.p) > 0) s.ps = Math.floor(Number(x.p));
    if (Array.isArray(x.c)) s.cols = x.c.filter(v => typeof v === 'string');
    if (Array.isArray(x.e)) s.dcols = x.e.filter(v => typeof v === 'string');
    if (x.n && typeof x.n === 'object') { s.nums = {}; for (const q in x.n) s.nums[q] = String(x.n[q]); }
    d.st[t] = s;
    d.lists[t] = { hidden: names(x.h), watch: names(x.v) };
    if (x.s && typeof x.s === 'object') d.presets[t] = x.s;
  }
  return d;
}

function settingsSheet() {
  sheet(`<h3>Settings code</h3>
  <div class="sec"><p class="dim">This code holds your settings, hidden items and watchlist, and it changes as you change them. Enter it on another device to get them back. No account or server needed.</p>
    <textarea class="in" id="s-out" rows="5" readonly spellcheck="false">Making your code…</textarea>
    <div class="row"><button class="b" id="s-copy" disabled>Copy code</button><span class="dim" id="s-len"></span></div></div>
  <div class="sec"><p class="dim">Have a code from another device? Paste it here. This replaces the settings on this device.</p>
    <textarea class="in" id="s-code" rows="3" placeholder="GEB-…" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
    <button class="b" id="s-load">Load settings</button><div id="s-err"></div></div>
  <div class="act"><button class="b" data-close>Close</button></div>`);
  const out = $('#s-out'); let mine = '';
  makeCode().then(c => {
    mine = c; out.value = c;
    $('#s-len').textContent = c.length + ' characters';
    $('#s-copy').disabled = false;
  }).catch(() => { out.value = 'Could not make a code.'; });
  out.onfocus = () => out.select();
  $('#s-copy').onclick = () => copy(mine);
  $('#s-load').onclick = async () => {
    const err = $('#s-err'), b = $('#s-load');
    err.innerHTML = ''; b.disabled = true;
    try { applySettings(await readCode($('#s-code').value)); closeSheet(); toast('Settings loaded'); }
    catch (x) { err.innerHTML = `<div class="err">${esc(x.message)}</div>`; }
    b.disabled = false;
  };
}

function infoSheet() {
  sheet(`<h3>How to use</h3>
  <div class="kv"><span>Tap or click an item</span><span>Open actions</span></div>
  <div class="kv"><span>Actions</span><span>History, wiki, copy, watch, hide</span></div>
  <div class="kv"><span>Numbers accept</span><span>5k, 2.5m, 1b</span></div>
  <div class="kv"><span>Filters</span><span>Press Enter or Refresh to apply</span></div>
  <div class="kv"><span>Columns</span><span>Choose what each card shows</span></div>
  <div class="kv"><span>▼ / ▲</span><span>Sort direction (on desktop, click a column header)</span></div>
  <div class="kv"><span>⚙ Settings</span><span>Code that restores settings, hidden and watchlist items</span></div>
  <div class="kv"><span>Won't load?</span><span>Open it over http://, not as a file</span></div>
  <div class="act"><button class="b" data-close>OK</button></div>`);
}

async function copy(s) {
  try { await navigator.clipboard.writeText(s); }
  catch {
    const x = document.createElement('textarea');
    x.value = s; document.body.appendChild(x); x.select();
    try { document.execCommand('copy'); } catch {}
    x.remove();
  }
  toast('Copied');
}
let tt;
function toast(m) {
  const e = $('#toast');
  e.textContent = m; e.hidden = false;
  clearTimeout(tt); tt = setTimeout(() => e.hidden = true, 1800);
}

/* ---------- shell ---------- */
function theme() {
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  $('#theme').textContent = dark ? '☀' : '☾';
  $('meta[name=theme-color]').content = dark ? '#141517' : '#f1f0ec';
}
$('#theme').onclick = () => { dark = !dark; theme(); save(); };
$('#info').onclick = infoSheet;
$('#cfgb').onclick = settingsSheet;
function setTab(t) {
  cur = t;
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  ctl(); render(); save();
}
document.querySelector('.tabs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (b) setTab(b.dataset.t);
});
setInterval(() => {
  const n = Date.now() / 1e3;
  document.querySelectorAll('[data-ts]').forEach(e => e.textContent = fmtAge(+e.dataset.ts, n));
}, 30000);

/* ---------- init ---------- */
theme();
setTab(cur);
for (const t in TABS) { refresh(t); arm(t); }
</script>
